<script type="module">
import { createSupabaseClient } from './packages/core/client.js';
import {
  getLeafNodes, getNodeSuggestions, searchNodes, createNode, updateNode, deleteNode, promoteToParent,
  listNodesWithPaths, listNodes, getDescendantIds, archiveNode, unarchiveNode
} from './packages/core/nodes.js';
import { recordLine, reviseLine, deleteLine } from './packages/core/lines.js';
import {
  listLines, getNetWorth, getRollupBalances, getCumulative, getLinesForNodes,
  getNetWorthDaily, getMonthlyFlow, getDailyDeltas
} from './packages/core/reports.js';
import { importMemoKey } from './packages/core/crypto.js';

const supabase = createSupabaseClient(
  'https://sicucuywqqcapbogfkoy.supabase.co',
  'sb_publishable_oInvR1n1J0y_ereuoDT6pw_odcKt4ya'
);

// Same key as .env's MEMO_ENCRYPTION_KEY. Not a secret from anyone reading
// this page's source (no server to hide it behind) - it only keeps memo out
// of the Supabase dashboard, which connects with a role that bypasses RLS.
const memoKey = await importMemoKey('obUs/GKDLfSYucBlOHMOfVin3+iyEDk57/BS/T6Aoqs=');

const root = document.getElementById('root');

let session = null;
let state = { page: 'login', detailNodeId: null };
let chartMode = localStorage.getItem('kakeibo:chartMode') || 'cumulative';
let nodeViewMode = localStorage.getItem('kakeibo:nodeViewMode') || 'list';
let hiddenNodeIds = new Set(JSON.parse(localStorage.getItem('kakeibo:hiddenNodeIds') || '[]'));
let showArchivedNodes = false;
// Which parent nodes are expanded in a collapsible hierarchy view (node
// list's 資産/負債/支出・収入 sections, node management's tree). Starts empty
// so every tree opens collapsed to just its top level (DESIGN.md UX方針).
let expandedNodeIds = new Set();
let selectedToNode = null;
let editingLineId = null;
let nodesById = new Map();
let linesById = new Map();
let chartData = [];
let txListRows = [];
let txListOffset = 0;
let txListDone = false;
const TX_PAGE_SIZE = 20;

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function yen(n) {
  const v = Number(n ?? 0);
  return (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('ja-JP');
}

// Per-node masking (so e.g. a salary or a specific liability can be hidden
// while everything else stays visible). Transaction amounts are left alone -
// hiding what things cost isn't the point, hiding how much money there is, is.
function isNodeHidden(nodeId) {
  return hiddenNodeIds.has(nodeId);
}

function maskNodeYen(nodeId, n) {
  return isNodeHidden(nodeId) ? '••••••' : yen(n);
}

// Small icon-only toggle meant to sit inside a clickable row/card; callers
// must stopPropagation so it doesn't also trigger the row's own click.
function nodeHideToggleButton(nodeId) {
  return `<button type="button" class="node-hide-btn" data-node-hide-id="${nodeId}" title="${isNodeHidden(nodeId) ? 'このノードを表示' : 'このノードを非表示'}">${isNodeHidden(nodeId) ? '🙈' : '🐵'}</button>`;
}

function toggleNodeHidden(nodeId) {
  if (hiddenNodeIds.has(nodeId)) hiddenNodeIds.delete(nodeId);
  else hiddenNodeIds.add(nodeId);
  localStorage.setItem('kakeibo:hiddenNodeIds', JSON.stringify([...hiddenNodeIds]));
  render();
}

// Archiving (is_archived) removes a node from the node list entirely - unlike
// the mask toggle above, which only hides the amount. Meant for leaf nodes
// that turned out to have no practical use; restorable via 復元.
function nodeArchiveButton(nodeId) {
  return `<button type="button" class="node-hide-btn" data-node-archive-id="${nodeId}" title="このノードをアーカイブ(一覧から隠す)">📦</button>`;
}

async function handleArchiveNode(nodeId) {
  if (!confirm('このノードをアーカイブしますか？一覧から隠れます（記録は残ります）。')) return;
  await archiveNode(supabase, nodeId);
  await render();
}

async function handleUnarchiveNode(nodeId) {
  await unarchiveNode(supabase, nodeId);
  await render();
}

// Deletion also supersedes every line touching the node (see nodes.js#deleteNode) -
// a transaction always has two ends, so removing it changes both nodes' history,
// not just the one being deleted here.
async function handleDeleteNode(nodeId) {
  const node = nodesById.get(nodeId);
  const label = node?.path ?? node?.name ?? nodeId;
  if (!confirm(`「${label}」を削除しますか？関連する取引もすべて削除されます（元に戻せません）。`)) return;

  let result;
  try {
    result = await deleteNode(supabase, nodeId);
  } catch (error) {
    alert(error.message);
    return;
  }

  if (state.editNode?.id === nodeId) state.editNode = null;
  invalidateTxCache();
  await render();

  if (result.archived) {
    alert('過去の取引履歴が残っているため完全な削除はできず、取引を削除したうえでノードをアーカイブしました。');
  }
}

function todayISODate() {
  return new Date().toISOString().slice(0, 10);
}

function monthStart(date = new Date()) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-01`;
}

const SPEND_PERIODS = {
  month: '今月',
  last_month: '先月',
  '30d': '直近30日',
  all: '全期間'
};

// {from, to} bounds (or {null, null} for "all") to scope 消費相手 上位 by.
function periodRange(period) {
  const today = new Date();
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  if (period === 'month') return { from: monthStart(today), to: iso(today) };

  if (period === 'last_month') {
    const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    const lastDayOfLastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
    return { from: monthStart(lastMonth), to: iso(lastDayOfLastMonth) };
  }

  if (period === '30d') {
    const from = new Date(today);
    from.setDate(from.getDate() - 30);
    return { from: iso(from), to: iso(today) };
  }

  return { from: null, to: null };
}

function go(page, extra = {}) {
  // Fully replace state (not merge) so leftover transient state from a
  // previous visit - an in-progress edit, a pending hierarchy confirmation,
  // a search query - doesn't leak into an unrelated later visit to the page.
  state = { page, ...extra };
  render();
  window.scrollTo(0, 0);
}

const NODE_TYPE_META = {
  asset: { label: '資産', color: 'var(--accent)' },
  liability: { label: '負債', color: 'var(--negative)' },
  flow: { label: '収支', color: 'var(--secondary)' }
};

// ============================================================
// Shared node-hierarchy helpers (mirrors nodes.js#getLeafNodes but keeps
// path/depth info the UI needs; still just filtering already-fetched rows).
// ============================================================

async function loadAllNodesWithPaths() {
  const nodes = await listNodesWithPaths(supabase);
  nodesById = new Map(nodes.map((n) => [n.id, n]));
  return nodes;
}

function computeSpendingDestinations(nodes, balanceByNodeId) {
  const parentIds = new Set(nodes.map((n) => n.parent_id).filter(Boolean));
  return nodes
    .filter((n) => n.node_type === 'flow' && !parentIds.has(n.id))
    .filter((n) => Number(balanceByNodeId.get(n.id) ?? 0) > 0)
    .sort((a, b) => Number(balanceByNodeId.get(b.id)) - Number(balanceByNodeId.get(a.id)));
}

// Groups `list` by parent_id (root nodes under the 'root' key) - the shared
// basis for every collapsible-tree render below.
function buildChildrenMap(list) {
  const map = new Map();
  list.forEach((n) => {
    const key = n.parent_id ?? 'root';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(n);
  });
  return map;
}

function isNodeExpanded(nodeId) {
  return expandedNodeIds.has(nodeId);
}

function toggleNodeExpanded(nodeId) {
  if (expandedNodeIds.has(nodeId)) expandedNodeIds.delete(nodeId);
  else expandedNodeIds.add(nodeId);
  render();
}

// Caret shown in place of nodeHideToggleButton/nodeArchiveButton's spot when
// a row has children to fold away; a fixed-width spacer otherwise, so leaf
// rows in the same tree still line up with their siblings that have one.
function treeToggleCell(nodeId, hasChildren) {
  if (!hasChildren) return '<span class="tree-toggle-spacer"></span>';
  const expanded = isNodeExpanded(nodeId);
  return `<button type="button" class="tree-toggle-btn" data-tree-toggle-id="${nodeId}" title="${expanded ? '折りたたむ' : '展開する'}">${expanded ? '▾' : '▸'}</button>`;
}

// Renders `list` (a single node_type's nodes) as a collapsible tree: each
// root and each expanded node's children, recursively. Nodes collapse to
// just their top level by default (DESIGN.md UX方針) - this is what keeps a
// node's own row from also being duplicated by every descendant appearing
// in the same flat section.
function renderNodeTree(list, rowRenderer) {
  const childrenByParent = buildChildrenMap(list);
  const renderNode = (n, depth) => {
    const children = (childrenByParent.get(n.id) ?? []).sort((a, b) => a.name.localeCompare(b.name));
    const expanded = children.length > 0 && isNodeExpanded(n.id);
    const row = rowRenderer(n, depth, children.length > 0);
    const childrenHtml = expanded ? children.map((c) => renderNode(c, depth + 1)).join('') : '';
    return row + childrenHtml;
  };
  const roots = (childrenByParent.get('root') ?? []).sort((a, b) => a.name.localeCompare(b.name));
  return roots.map((n) => renderNode(n, 0)).join('');
}

// ============================================================
// Shared transaction-row rendering (used by 記録/取引一覧/ノード詳細)
// ============================================================

function renderTxRow(l) {
  linesById.set(l.id, l);
  return `
    <div class="row">
      <span class="row-date mono">${l.occurred_on}</span>
      <div class="row-main">
        <div>${esc(l.from_name)} → ${esc(l.to_name)}</div>
        ${l.memo ? `<div class="row-memo">${esc(l.memo)}</div>` : ''}
      </div>
      <span class="mono">${yen(l.amount)}</span>
      <span class="row-actions">
        <button type="button" class="btn-sm tx-edit" data-id="${l.id}">編集</button>
        <button type="button" class="btn-sm danger tx-delete" data-id="${l.id}">削除</button>
      </span>
    </div>
  `;
}

function attachTxRowActions(container) {
  container.querySelectorAll('.tx-edit').forEach((btn) => {
    btn.addEventListener('click', () => {
      const line = linesById.get(btn.dataset.id);
      go('record', { editLine: line });
    });
  });
  container.querySelectorAll('.tx-delete').forEach((btn) => {
    btn.addEventListener('click', () => handleDeleteLine(btn.dataset.id));
  });
}

// The tx-list page caches fetched rows client-side for pagination/search;
// any write must invalidate it so a stale (deleted/edited) row doesn't
// linger there until an unrelated reload.
function invalidateTxCache() {
  txListRows = [];
  txListOffset = 0;
  txListDone = false;
}

async function handleDeleteLine(lineId) {
  if (!confirm('この取引を削除しますか？')) return;
  await deleteLine(supabase, lineId);
  if (editingLineId === lineId) editingLineId = null;
  invalidateTxCache();
  await render();
}

// ============================================================
// Bar chart (zero-axis, positive above in green, negative below in blue)
// ============================================================

// Computed once from both series (cumulative_balance and daily_delta) so the
// y-axis scale - and therefore its labels - stays fixed when the user toggles
// chart mode, instead of rescaling and jumping around each time.
function computeChartMaxAbs(points) {
  return Math.max(
    ...points.map((p) => Math.abs(Number(p.cumulative_balance))),
    ...points.map((p) => Math.abs(Number(p.daily_delta))),
    1
  );
}

function renderBarChartAxis(points, valueKey, maxAbs, hidden) {
  if (points.length === 0) return '<p style="font-size:13px;color:var(--faint);">データなし</p>';

  const half = 40;
  const bars = points.map((p) => {
    const value = Number(p[valueKey]);
    const posHeight = value > 0 ? Math.max(2, Math.round((value / maxAbs) * half)) : 0;
    const negHeight = value < 0 ? Math.max(2, Math.round((Math.abs(value) / maxAbs) * half)) : 0;
    return `
      <div class="bar-col" title="${p.occurred_on}: ${hidden ? '••••••' : value}">
        <div class="bar-top"><div class="bar pos-bar" style="height:${posHeight}px"></div></div>
        <div class="bar-bottom"><div class="bar neg-bar" style="height:${negHeight}px"></div></div>
      </div>
    `;
  }).join('');

  const mid = points[Math.floor(points.length / 2)];
  const axisLabel = (n) => (hidden ? '••••••' : yen(n));

  return `
    <div style="display:flex;gap:8px;align-items:stretch;">
      <div class="y-axis-labels mono">
        <span>${axisLabel(maxAbs)}</span>
        <span>0</span>
        <span>${axisLabel(-maxAbs)}</span>
      </div>
      <div class="bar-chart-axis" style="flex:1;">${bars}</div>
    </div>
    <div class="trend-axis" style="margin-left:60px;">
      <span>${points[0].occurred_on}</span>
      <span>${mid.occurred_on}</span>
      <span>${points[points.length - 1].occurred_on}</span>
    </div>
  `;
}

async function renderDashboardPage() {
  const nodes = await loadAllNodesWithPaths();
  const balances = await getRollupBalances(supabase);
  const balanceByNodeId = new Map(balances.map((b) => [b.node_id, b.balance]));

  const [netWorth, dailyNetWorth, monthlyFlow, recentLines] = await Promise.all([
    getNetWorth(supabase),
    getNetWorthDaily(supabase),
    getMonthlyFlow(supabase, monthStart()),
    listLines(supabase, { ascending: false, limit: 5 }, memoKey)
  ]);

  const trendPoints = dailyNetWorth.slice(-30);
  const trendMin = Math.min(0, ...trendPoints.map((p) => Number(p.net_worth)));
  const trendMax = Math.max(1, ...trendPoints.map((p) => Number(p.net_worth)));
  const trendBars = trendPoints
    .map((p) => {
      const pct = Math.max(4, Math.round(((Number(p.net_worth) - trendMin) / (trendMax - trendMin || 1)) * 100));
      return `<div style="height:${pct}%" title="${p.occurred_on}: ${yen(p.net_worth)}"></div>`;
    })
    .join('');

  const spendPeriod = state.spendPeriod ?? 'month';
  const { from: spendFrom, to: spendTo } = periodRange(spendPeriod);
  const spendDeltas = await getDailyDeltas(supabase, { from: spendFrom, to: spendTo });

  spendDeltas.forEach((d) => {
    periodBalanceByNodeId.set(d.node_id, (periodBalanceByNodeId.get(d.node_id) ?? 0) + Number(d.delta));

  const spendingDestinations = computeSpendingDestinations(nodes, periodBalanceByNodeId).slice(0, 5);
  const maxSpend = Math.max(...spendingDestinations.map((n) => Number(periodBalanceByNodeId.get(n.id))), 1);
  const topSpendRows = spendingDestinations

  const recentRows = recentLines.map((l) => renderTxRow(l)).join('') || '<p style="font-size:13px;color:var(--faint);">まだ記録がありません</p>';

  const today = new Date();
  const monthLabel = `${today.getFullYear()}年${today.getMonth() + 1}月`;
  const rangeLabel = `${today.getMonth() + 1}月1日 – ${today.getMonth() + 1}月${today.getDate()}日の集計`;

  return `

      <div class="card-head">
        <div>
          <h1>${monthLabel}</h1>

          <div class="stat-value mono neg">${yen(monthlyFlow.spend)}</div>
        </div>

          </div>
          <div class="trend-bars">${trendBars || ''}</div>

async function renderRecordPage() {
  // editingLineId/selectedToNode are plain globals, not part of `state`, so
  // they must be derived fresh from state.editLine on every render - not
  // just set when editing, or a fresh (non-edit) visit to this page after an
  // earlier edit session would keep showing 更新 instead of 登録.
  const editLine = state.editLine ?? null;
  if (editLine) {
    editingLineId = editLine.id;
    selectedToNode = { id: editLine.to_node, path: editLine.to_name };
  } else {
    editingLineId = null;
    selectedToNode = null;
  }

  const [assetsAndLiabilities, suggestions, todayLines] = await Promise.all([
    getLeafNodes(supabase),
    getNodeSuggestions(supabase, 8),
    listLines(supabase, { ascending: false, limit: 50 }, memoKey)
  ]);

  const typeOrder = { asset: 0, liability: 1, flow: 2 };
  assetsAndLiabilities.sort((a, b) => typeOrder[a.node_type] - typeOrder[b.node_type] || a.name.localeCompare(b.name));

  const fromValue = editLine?.from_node ?? assetsAndLiabilities[0]?.id ?? '';
  const fromOptions = assetsAndLiabilities
    .map((n) => `<option value="${n.id}" ${n.id === fromValue ? 'selected' : ''}>${esc(n.name)}</option>`)
    .join('');

  const chipRow = suggestions
    .map((s) => {
      const selected = selectedToNode?.id === s.node_id;
      return `<button type="button" class="chip${selected ? ' selected' : ''}" data-id="${s.node_id}" data-path="${esc(s.path ?? '')}">${esc((s.path ?? s.node_id).split(' > ').pop())}</button>`;
    })
    .join('');

  const todayISO = todayISODate();
  const todayRows = todayLines.filter((l) => l.occurred_on === todayISO).map((l) => renderTxRow(l)).join('')
    || '<p style="font-size:12px;color:var(--faint);">今日はまだありません</p>';

  return `
    <div class="breadcrumb"><a href="#" data-nav="dashboard">ダッシュボード</a><span>/</span><span>記録</span></div>
    <div class="grid-fit-320">
      <section class="card">
        <div class="card-head">
          <h1>記録</h1>
          <button type="button" class="btn" style="width:auto;" data-nav="manage">ノードを追加</button>
        </div>
        <p style="margin:2px 0 20px;font-size:12.5px;color:var(--muted);">お金の出どころと行き先を選んで金額を入れます。</p>
        <div class="stack" style="gap:18px;">
          <label class="field">出どころ
            <select id="from-select">${fromOptions}</select>
          </label>

          <div class="field" style="gap:8px;">
            <div style="display:flex;align-items:baseline;justify-content:space-between;">
              <span>行き先</span>
              <span id="selected-to" style="color:var(--accent);font-size:12px;">${selectedToNode ? esc(selectedToNode.path ?? selectedToNode.id) : '未選択'}</span>
            </div>
            <div class="chip-row" id="suggestions">${chipRow}</div>
            <input id="to-search" type="text" placeholder="行き先を検索（食費、マクドナルド...）">
            <div class="search-results" id="search-results"></div>
          </div>

          <div class="grid-fit" style="grid-template-columns:1fr 1fr;">
            <label class="field">金額<input id="amount" type="number" placeholder="0" value="${editLine?.amount ?? ''}" style="font-size:18px;" class="mono"></label>
            <label class="field">日付<input id="occurred-on" type="date" value="${editLine?.occurred_on ?? todayISO}"></label>
          </div>

          <label class="field">メモ<input id="memo" type="text" placeholder="任意" value="${esc(editLine?.memo ?? '')}"></label>

          <div style="display:flex;gap:8px;">
            <button id="add-btn" class="btn-primary" style="flex:1;">${editingLineId ? '更新' : '登録'}</button>
            <button id="cancel-edit-btn" type="button" class="btn" style="${editingLineId ? '' : 'display:none;'}">キャンセル</button>
          </div>
          <p id="add-error" style="color:var(--negative);font-size:12px;margin:0;"></p>
        </div>
      </section>

      <section class="card">
        <h2>今日の記録</h2>
        <p style="margin:2px 0 8px;font-size:12px;color:var(--muted);">登録するとここに追加されます。</p>
        <div id="today-tx">${todayRows}</div>
        <p style="margin:12px 0 0;font-size:12px;color:var(--faint);line-height:1.7;">よく使う行き先は上のチップに自動で並びます。新しい店や科目は<a href="#" data-nav="manage">ノード管理</a>から作成できます。</p>
      </section>
    </div>
  `;
}

function selectToNodeInline(node) {
  selectedToNode = node;
  document.getElementById('selected-to').textContent = node.path ?? node.name ?? node.id;
  root.querySelectorAll('#suggestions .chip').forEach((btn) => {
    btn.classList.toggle('selected', btn.dataset.id === node.id);
  });
  document.getElementById('search-results').innerHTML = '';
  document.getElementById('to-search').value = '';
}

function wireRecord() {
  attachTxRowActions(document.getElementById('today-tx'));

  root.querySelectorAll('#suggestions .chip').forEach((btn) => {
    btn.addEventListener('click', () => selectToNodeInline({ id: btn.dataset.id, path: btn.dataset.path }));
  });

  document.getElementById('to-search').addEventListener('input', async (e) => {
    const query = e.target.value.trim();
    const resultsEl = document.getElementById('search-results');
    if (!query) {
      resultsEl.innerHTML = '';
      return;
    }
    const results = await searchNodes(supabase, query);
    resultsEl.innerHTML = results.map((n) => `<div data-id="${n.id}" data-path="${esc(n.path)}">${esc(n.path)}</div>`).join('');
    resultsEl.querySelectorAll('div').forEach((el) => {
      el.addEventListener('click', () => selectToNodeInline({ id: el.dataset.id, path: el.dataset.path }));
    });
  });

  document.getElementById('cancel-edit-btn').addEventListener('click', () => {
    editingLineId = null;
    selectedToNode = null;
    state.editLine = null;
    render();
  });

  document.getElementById('add-btn').addEventListener('click', async () => {
    const errorEl = document.getElementById('add-error');
    errorEl.textContent = '';

    if (!selectedToNode) {
      errorEl.textContent = '行き先を選択してください';
      return;
    }

    const fromNode = document.getElementById('from-select').value;
    const amount = Number(document.getElementById('amount').value);
    const memo = document.getElementById('memo').value;
    const occurredOn = document.getElementById('occurred-on').value;

    try {
      if (editingLineId) {
        await reviseLine(supabase, editingLineId, { occurredOn, fromNode, toNode: selectedToNode.id, amount, memo }, memoKey);
      } else {
        const { data: { user } } = await supabase.auth.getUser();
        await recordLine(supabase, { userId: user.id, occurredOn, fromNode, toNode: selectedToNode.id, amount, memo }, memoKey);
      }
    } catch (error) {
      errorEl.textContent = error.message;
      return;
    }

    editingLineId = null;
    selectedToNode = null;
    state.editLine = null;
    invalidateTxCache();
    render();
  });
}

// Small inline line chart of a node's cumulative balance over time, for the
// card view. Just draws already-fetched v_cumulative points - no aggregation.
function renderSparkline(points, color, width = 100, height = 28) {
  if (points.length < 2) return `<div style="height:${height}px;"></div>`;

  const values = points.map((p) => Number(p.cumulative_balance));
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const stepX = width / (values.length - 1);
  const coords = values
    .map((v, i) => `${(i * stepX).toFixed(1)},${(height - ((v - min) / range) * height).toFixed(1)}`)
    .join(' ');

  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none" class="sparkline">
    <polyline points="${coords}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke" />
  </svg>`;
}

const nodeRow = (balanceByNodeId, n, indent = 0, canArchive = false, hasChildren = false) => `
  <div class="row clickable" data-id="${n.id}" data-name="${esc(n.name)}" style="padding-left:${indent}px;">
    ${treeToggleCell(n.id, hasChildren)}
    <span class="${indent ? 'indent-name' : ''}" style="flex:1;">${esc(n.name)}</span>
    <span class="mono">${maskNodeYen(n.id, balanceByNodeId.get(n.id))}</span>
    ${nodeHideToggleButton(n.id)}
    ${canArchive ? nodeArchiveButton(n.id) : ''}
  </div>
`;

function nodeCard(n, balanceByNodeId, { showPath = false, maxAbs = 1, sparkline = null, canArchive = false } = {}) {
  const balance = Number(balanceByNodeId.get(n.id) ?? 0);
  const parentPath = showPath && n.path.includes(' > ') ? n.path.slice(0, n.path.lastIndexOf(' > ')) : '';
  const type = NODE_TYPE_META[n.node_type];
  const pct = Math.max(4, Math.round((Math.abs(balance) / maxAbs) * 100));
  return `
    <div class="node-card clickable" data-id="${n.id}" data-name="${esc(n.name)}" style="border-left-color:${type.color};">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span class="badge" style="color:${type.color};">${type.label}</span>
        <span style="display:flex;">
          ${nodeHideToggleButton(n.id)}
          ${canArchive ? nodeArchiveButton(n.id) : ''}
        </span>
      </div>
      ${parentPath ? `<span class="path">${esc(parentPath)}</span>` : ''}
      <span class="name">${esc(n.name)}</span>
      ${sparkline ? renderSparkline(sparkline, type.color) : ''}
      <span class="balance mono ${balance < 0 ? 'neg' : ''}">${maskNodeYen(n.id, balance)}</span>
      <span class="mini-bar-track"><span class="mini-bar-fill" style="width:${pct}%;background:${type.color};"></span></span>
    </div>
  `;
}

// Only a leaf node (no children) is safe to archive from here: hiding an
// intermediate node would orphan its children from the flow tree render.
function archivedRow(n) {
  return `
    <div class="row">
      <span style="flex:1;color:var(--faint);">${esc(n.name)}</span>
      <span style="font-size:11px;color:var(--faint);letter-spacing:0.03em;">${n.node_type}</span>
      <button type="button" class="btn-sm" data-node-unarchive-id="${n.id}">復元</button>
    </div>
  `;
}

async function renderNodesPage() {
  const [allNodesRaw, balances] = await Promise.all([
    listNodesWithPaths(supabase, { includeArchived: true }),
    getRollupBalances(supabase)
  ]);
  const balanceByNodeId = new Map(balances.map((b) => [b.node_id, b.balance]));
  const nodes = allNodesRaw.filter((n) => !n.is_archived);
  const archivedNodesList = allNodesRaw.filter((n) => n.is_archived);

  // Archiving is only offered for leaf nodes: hiding an intermediate node
  // would orphan its children from the flow tree / section it belongs to.
  const nonLeafIds = new Set(nodes.filter((n) => n.parent_id).map((n) => n.parent_id));
  const canArchive = (n) => !nonLeafIds.has(n.id);

  const archivedSection = showArchivedNodes ? `
    <section class="card">
      <h3>アーカイブ済み</h3>
      <p class="card-note">一覧・集計・入力候補には出てきません。記録は残っています。</p>
      ${archivedNodesList.map(archivedRow).join('') || '<p style="font-size:12.5px;color:var(--faint);">アーカイブ済みのノードはありません</p>'}
    </section>
  ` : '';

  const viewToggle = `
    <div class="view-toggle">
      <button type="button" id="view-list-btn" class="btn${nodeViewMode === 'list' ? ' selected' : ''}">リスト</button>
      <button type="button" id="view-card-btn" class="btn${nodeViewMode === 'card' ? ' selected' : ''}">カード</button>
    </div>
  `;

  const pageHead = (note) => `
    <div class="stack" style="gap:12px;">
      <div class="breadcrumb"><a href="#" data-nav="dashboard">ダッシュボード</a><span>/</span><span>ノード一覧</span></div>
      <div class="card-head">
        <div>
          <h1>ノード一覧</h1>
          <p style="margin:2px 0 0;font-size:12.5px;color:var(--muted);">${note}</p>
        </div>
        <button class="btn-primary" style="width:auto;" data-nav="manage">ノードを作成</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button type="button" id="toggle-archived-btn" class="btn">${showArchivedNodes ? 'アーカイブ済みを隠す' : 'アーカイブ済みを表示'}</button>
        ${viewToggle}
      </div>
  `;

  if (nodeViewMode === 'card') {
    // Color already distinguishes 資産/負債/収支, so card view mixes every
    // node into one grid (biggest balance first) instead of boxed sections.
    const allNodes = [...nodes].sort((a, b) =>
      Math.abs(Number(balanceByNodeId.get(b.id) ?? 0)) - Math.abs(Number(balanceByNodeId.get(a.id) ?? 0))
    );
    const sparklines = await Promise.all(allNodes.map((n) => getCumulative(supabase, n.id)));
    const sparklineByNodeId = new Map(allNodes.map((n, i) => [n.id, sparklines[i]]));
    const maxAbs = Math.max(...allNodes.map((n) => Math.abs(Number(balanceByNodeId.get(n.id) ?? 0))), 1);

    const cardsHtml = allNodes
      .map((n) => nodeCard(n, balanceByNodeId, {
        showPath: n.node_type === 'flow',
        maxAbs,
        sparkline: sparklineByNodeId.get(n.id),
        canArchive: canArchive(n)
      }))
      .join('');

    return `
      ${pageHead('残高の推移(折れ線)・大きさ順に並んでいます。色は資産/負債/収支。')}
        <div class="node-card-grid">${cardsHtml || '<p style="font-size:12.5px;color:var(--faint);">ノードがありません</p>'}</div>
        ${archivedSection}
      </div>
    `;
  }

  const byType = { asset: [], liability: [], flow: [] };
  nodes.forEach((n) => byType[n.node_type].push(n));

  // A single tree renderer for all three sections: a node's row shows its
  // own rollup total, and its children are hidden until expanded. That's
  // what keeps a parent's rollup and its descendants' individual amounts
  // from both sitting in the section at once looking like unrelated,
  // overlapping numbers (e.g. 立て替え and 立て替え > 友人A).
  const hierarchySection = (label, note, list, totalColor = '') => {
    const roots = list.filter((n) => !n.parent_id).sort((a, b) => a.name.localeCompare(b.name));
    const total = roots.reduce((sum, n) => sum + Number(balanceByNodeId.get(n.id) ?? 0), 0);
    const rows = renderNodeTree(list, (n, depth, hasChildren) => nodeRow(balanceByNodeId, n, depth * 16, canArchive(n), hasChildren));
    return `
      <section class="card">
        <div class="card-head">
          <h3>${label}</h3>
          <span class="mono" style="font-size:12.5px;${totalColor}">${yen(total)}</span>
        </div>
        <p class="card-note">${note}</p>
        ${rows || '<p style="font-size:12.5px;color:var(--faint);">ノードがありません</p>'}
      </section>
    `;
  };

  const spendingDestinations = computeSpendingDestinations(nodes, balanceByNodeId);
  const spendTotal = spendingDestinations.reduce((sum, n) => sum + Number(balanceByNodeId.get(n.id)), 0);
  const spendRows = spendingDestinations.map((n) => nodeRow(balanceByNodeId, n, 0, canArchive(n))).join('');

  return `
    ${pageHead('資産・負債は現在残高、支出・収入は子孫を含む累計です。子を持つ行は▸で展開できます。')}
      <div class="grid-fit-300">
        ${hierarchySection('資産', '財布・銀行・電子マネーなど', byType.asset)}
        ${hierarchySection('負債', '未払いのクレジット残など', byType.liability, 'color:var(--negative);')}
        <section class="card">
          <div class="card-head">
            <h3>消費相手（多い順）</h3>
            <span class="mono" style="font-size:12.5px;color:var(--negative);">${yen(spendTotal)}</span>
          </div>
          <p class="card-note">flow の葉ノード・残高が正のもの</p>
          ${spendRows || '<p style="font-size:12.5px;color:var(--faint);">記録がありません</p>'}
        </section>
        ${hierarchySection('支出・収入（階層）', '子孫を含む累計', byType.flow)}
        ${archivedSection}
      </div>
    </div>
  `;
}

async function renderManagePage() {
  const nodes = await loadAllNodesWithPaths();
  const pending = state.pendingPromote ?? null;
  const editNode = state.editNode ?? null;

  // A node can't become its own parent, and can't move under its own
  // descendant either (the DB blocks the cycle anyway, but filtering it out
  // of the picker up front is clearer than surfacing a DB error for it).
  const excludedIds = editNode
    ? new Set(nodes.filter((n) => n.id === editNode.id || n.path.startsWith(`${editNode.path} > `)).map((n) => n.id))
    : new Set();

  const selectedParentId = pending?.parentId ?? (editNode ? (editNode.parent_id ?? '') : '');
  const parentOptions = ['<option value="">なし（ルートノード）</option>']
    .concat(
      nodes
        .filter((n) => !excludedIds.has(n.id))
        .map((n) => `<option value="${n.id}" ${selectedParentId === n.id ? 'selected' : ''}>${esc(n.path)}</option>`)
    )
    .join('');

  const parentNode = pending ? nodesById.get(pending.parentId) : null;
  const selectedNodeType = pending ? parentNode?.node_type : editNode?.node_type;

  const confirmBox = pending ? `
    <div class="confirm-box">
      <div style="font-size:12.5px;font-weight:700;margin-bottom:4px;">階層化の確認</div>
      <p style="margin:0 0 12px;font-size:12.5px;color:var(--label);line-height:1.7;">
        「${esc(parentNode?.name ?? '')}」には既に記録があります。既存の記録を「その他（${esc(parentNode?.name ?? '')}）」へ移して階層化しますか？
      </p>
      <div style="display:flex;gap:8px;">
        <button id="confirm-promote-btn" class="btn" style="background:var(--text);color:#fff;border:none;">${pending.action === 'move' ? '移して更新' : '移して作成'}</button>
        <button id="cancel-promote-btn" class="btn">やめる</button>
      </div>
    </div>
  ` : '';

  // Collapsible so a large hierarchy doesn't turn this into a long scroll of
  // rows - each node folds its descendants away until its ▸ is expanded.
  const treeRows = renderNodeTree(nodes, (n, depth, hasChildren) => `
    <div class="row">
      ${treeToggleCell(n.id, hasChildren)}
      <span style="padding-left:${depth * 16}px;${depth ? 'color:var(--muted);' : ''}flex:1;">${esc(n.name)}</span>
      <span style="font-size:11px;color:var(--faint);letter-spacing:0.03em;">${n.node_type}</span>
      <button type="button" class="btn-sm tree-edit-btn" data-id="${n.id}">編集</button>
      <button type="button" class="btn-sm danger tree-delete-btn" data-id="${n.id}">削除</button>
    </div>
  `);

  return `
    <div class="breadcrumb"><a href="#" data-nav="nodes">ノード一覧</a><span>/</span><span>ノード管理</span></div>
    <div class="grid-fit-320">
      <section class="card">
        <h1>${editNode ? `ノードを編集：${esc(editNode.name)}` : 'ノード管理'}</h1>
        <p style="margin:2px 0 20px;font-size:12.5px;color:var(--muted);">${editNode ? '名前と親ノード（＝一覧上の位置）を変更できます。種別は変更できません。' : '資産・負債・支出先を作成し、階層に組み込みます。'}</p>
        <div class="stack" style="gap:16px;">
          <label class="field">親ノード<select id="node-parent-select">${parentOptions}</select></label>
          <label class="field">種別
            <select id="node-type-select" ${editNode ? 'disabled' : ''}>
              <option value="flow" ${selectedNodeType === 'flow' || !pending && !editNode ? 'selected' : ''}>flow（支出・収入先）</option>
              <option value="asset" ${selectedNodeType === 'asset' ? 'selected' : ''}>asset（資産）</option>
              <option value="liability" ${selectedNodeType === 'liability' ? 'selected' : ''}>liability（負債）</option>
            </select>
          </label>
          <label class="field">ノード名<input id="node-name" type="text" placeholder="例: マクドナルド" value="${esc(pending?.name ?? editNode?.name ?? '')}"></label>
          <div style="display:flex;gap:8px;">
            <button id="node-create-btn" class="btn-primary" style="flex:1;">${editNode ? '更新' : 'ノードを作成'}</button>
            <button id="cancel-node-edit-btn" type="button" class="btn" style="${editNode ? '' : 'display:none;'}">キャンセル</button>
          </div>
          <p id="node-create-error" style="color:var(--negative);font-size:12px;margin:0;"></p>
        </div>
        ${confirmBox}
      </section>

      <section class="card">
        <h2>既存の階層</h2>
        <p style="margin:2px 0 10px;font-size:12px;color:var(--muted);">▸で子ノードを展開できます。編集で名前・位置を変更、削除で関連する取引ごと削除します。</p>
        <div id="tree-rows">${treeRows}</div>
      </section>
    </div>
  `;
}

function wireManagePage() {
  document.getElementById('node-parent-select').addEventListener('change', (e) => {
    if (state.editNode) return; // type stays locked while editing, regardless of parent
    const typeSelect = document.getElementById('node-type-select');
    const parent = nodesById.get(e.target.value);
    if (parent) {
      typeSelect.value = parent.node_type;
      typeSelect.disabled = true;
    } else {
      typeSelect.disabled = false;
    }
  });

  document.getElementById('node-create-btn').addEventListener('click', async () => {
    const errorEl = document.getElementById('node-create-error');
    errorEl.textContent = '';

    const name = document.getElementById('node-name').value.trim();
    const parentId = document.getElementById('node-parent-select').value || null;
    const nodeType = document.getElementById('node-type-select').value;
    if (!name) {
      errorEl.textContent = 'ノード名を入力してください';
      return;
    }

    const editNode = state.editNode;

    try {
      if (editNode) {
        await updateNode(supabase, editNode.id, { name, parentId });
      } else {
        const { data: { user } } = await supabase.auth.getUser();
        await createNode(supabase, { userId: user.id, name, parentId, nodeType });
      }
    } catch (error) {
      if (parentId && error.message.includes('promote_to_parent')) {
        state.pendingPromote = editNode
          ? { action: 'move', nodeId: editNode.id, parentId, name }
          : { action: 'create', parentId, nodeType, name };
        render();
        return;
      }
      errorEl.textContent = error.message;
      return;
    }

    state.pendingPromote = null;
    state.editNode = null;
    render();
  });

  const confirmBtn = document.getElementById('confirm-promote-btn');
  if (confirmBtn) {
    confirmBtn.addEventListener('click', async () => {
      const pending = state.pendingPromote;
      try {
        await promoteToParent(supabase, pending.parentId);
        if (pending.action === 'move') {
          await updateNode(supabase, pending.nodeId, { name: pending.name, parentId: pending.parentId });
        } else {
          const { data: { user } } = await supabase.auth.getUser();
          await createNode(supabase, { userId: user.id, name: pending.name, parentId: pending.parentId, nodeType: pending.nodeType });
        }
      } catch (error) {
        document.getElementById('node-create-error').textContent = error.message;
        return;
      }
      state.pendingPromote = null;
      state.editNode = null;
      render();
    });
  }

  const cancelBtn = document.getElementById('cancel-promote-btn');
  if (cancelBtn) {
    cancelBtn.addEventListener('click', () => {
      state.pendingPromote = null;
      render();
    });
  }

  const cancelEditBtn = document.getElementById('cancel-node-edit-btn');
  if (cancelEditBtn) {
    cancelEditBtn.addEventListener('click', () => {
      state.editNode = null;
      state.pendingPromote = null;
      render();
    });
  }

  root.querySelectorAll('.tree-edit-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.editNode = nodesById.get(btn.dataset.id);
      state.pendingPromote = null;
      render();
      window.scrollTo(0, 0);
    });
  });

  root.querySelectorAll('.tree-delete-btn').forEach((btn) => {
    btn.addEventListener('click', () => handleDeleteNode(btn.dataset.id));
  });
}

    localStorage.setItem('kakeibo:chartMode', chartMode);
  });

  document.getElementById('csv-export-btn').addEventListener('click', () => alert('準備中: CSVの書き出しは未実装です。'));
  document.getElementById('csv-import-btn').addEventListener('click', () => alert('準備中: CSVの取り込みは未実装です。'));

  document.getElementById('settings-logout-btn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    session = null;
    go('login');
  });
}

// ============================================================
// Router / top-level render
// ============================================================

async function render() {
  if (!session) {
    root.innerHTML = renderLoginPage();
    wireLogin();
    return;
  }

  let pageHtml = '';
  let wire = () => {};

  switch (state.page) {
    case 'record':
      pageHtml = await renderRecordPage();
      wire = wireRecord;
      break;
    case 'tx':
      if (txListRows.length === 0) await fetchTxPage(true);
      pageHtml = renderTxListPage();
      wire = wireTxList;
      break;
    case 'nodes':
      pageHtml = await renderNodesPage();
      wire = wireNodesPage;
      break;
    case 'detail':
      pageHtml = await renderDetailPage();
      wire = wireDetailPage;
      break;
    case 'manage':
      pageHtml = await renderManagePage();
      wire = wireManagePage;
      break;
    case 'settings':
      pageHtml = renderSettingsPage();
      wire = wireSettingsPage;
      break;
    case 'dashboard':
    default:
      pageHtml = await renderDashboardPage();
      wire = wireDashboard;
  }

  root.innerHTML = `<div class="app-shell">${renderHeader()}<main>${pageHtml}</main></div>`;
  wireHeader();
  root.querySelectorAll('[data-node-hide-id]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleNodeHidden(btn.dataset.nodeHideId);
    });
  });
  root.querySelectorAll('[data-tree-toggle-id]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleNodeExpanded(btn.dataset.treeToggleId);
    });
  });
  await wire();
}

const { data: { session: existingSession } } = await supabase.auth.getSession();
if (existingSession) {
  session = existingSession;
  go('record');
} else {
  render();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => console.error('SW registration failed', err));
  });
}
</script>
</body>
</html>
