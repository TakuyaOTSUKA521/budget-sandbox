<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Sandbox</title>

<!-- Local-dev-server fallback (frame-ancestors is ignored in a meta tag - the
     real enforcement, and the rest of these directives, are also sent as an
     HTTP header by vercel.json for the deployed site). script-src/style-src
     need 'unsafe-inline' because of the inline router <script type="module">
     below and per-render inline style="" attributes - everything else is
     scoped to only the origins this app actually talks to. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://sicucuywqqcapbogfkoy.supabase.co https://esm.sh; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2f7fa8">
<link rel="icon" href="./icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget Sandbox">
<meta name="mobile-web-app-capable" content="yes">

<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.112.4"
  }
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="root"></div>

<script type="module">
// 骨組みとルーティングのみ (MAINTENANCE.md §3)。各画面は views/、画面をまたいで
// 使う部品は components/、状態変数は state.js にある。
import { supabase } from './lib/supabase.js';
import { root, session, state, ui, cache, setSession, setRenderer, go, goBack } from './state.js';
import { renderSummerDecor, renderHeader, wireHeader } from './components/header.js';
import { toggleNodeHidden } from './components/maskToggle.js';
import { toggleNodeExpanded } from './components/collapsibleTree.js';
import { renderLoginPage, wireLogin } from './views/login.js';
import { renderDashboardPage, wireDashboard } from './views/dashboard.js';
import { renderRecordPage, wireRecord } from './views/record.js';
import { fetchTxPage, renderTxListPage, wireTxList } from './views/transactions.js';
import { renderNodesPage, wireNodesPage } from './views/nodes.js';
import { renderDetailPage, wireDetailPage } from './views/nodeDetail.js';
import { renderAnalysisPage, wireAnalysisPage } from './views/composition.js';
import { renderSettingsPage, wireSettingsPage } from './views/settings.js';
import { managerOpen, openManager, renderManagerModal, wireManagerModal } from './views/manager.js';

// Snapshots the record/manager forms still in the DOM before render()
// replaces it, so any re-render (tree ▸, 🙈, opening ノード管理 over 記録,
// picker clicks, ...) keeps what the user typed. Skipped per form when a
// handler flagged it to start fresh.
function captureFormDrafts() {
  const amountEl = document.getElementById('amount');
  ui.recordDraft = !ui.resetRecordForm && amountEl ? {
    amount: amountEl.value,
    occurredOn: document.getElementById('occurred-on').value,
    memo: document.getElementById('memo').value,
    excludeFromFlowTotals: document.getElementById('exclude-from-flow').checked,
  } : null;
  ui.resetRecordForm = false;

  const nodeNameEl = document.getElementById('node-name');
  ui.managerDraft = !ui.resetManagerForm && nodeNameEl ? {
    name: nodeNameEl.value,
    parentId: document.getElementById('node-parent-select').value || null,
    nodeType: document.getElementById('node-type-select').value,
    excludeFromFlowTotals: document.getElementById('node-exclude-flow').checked,
  } : null;
  ui.resetManagerForm = false;
}

async function render() {
  captureFormDrafts();
  if (!session) {
    root.innerHTML = renderSummerDecor() + renderLoginPage();
    wireLogin();
    return;
  }

  let pageHtml = '';
  let wire = () => {};

  switch (state.page) {
    case 'record':
      pageHtml = await renderRecordPage();
      wire = wireRecord;
      break;
    case 'tx':
      if (cache.txListRows.length === 0) await fetchTxPage(true);
      pageHtml = await renderTxListPage();
      wire = wireTxList;
      break;
    case 'nodes':
      pageHtml = await renderNodesPage();
      wire = wireNodesPage;
      break;
    case 'analysis':
      pageHtml = await renderAnalysisPage();
      wire = wireAnalysisPage;
      break;
    case 'detail':
      pageHtml = await renderDetailPage();
      wire = wireDetailPage;
      break;
    case 'settings':
      pageHtml = renderSettingsPage();
      wire = wireSettingsPage;
      break;
    case 'dashboard':
    default:
      pageHtml = await renderDashboardPage();
      wire = wireDashboard;
  }

  const managerHtml = managerOpen ? await renderManagerModal() : '';
  root.innerHTML = `${renderSummerDecor()}<div class="app-shell">${renderHeader()}<main>${pageHtml}</main>${managerHtml}</div>`;
  wireHeader();
  root.querySelectorAll('[data-node-hide-id]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleNodeHidden(btn.dataset.nodeHideId);
    });
  });
  root.querySelectorAll('[data-tree-toggle-id]').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleNodeExpanded(btn.dataset.treeToggleId);
    });
  });
  root.querySelectorAll('[data-open-manager]').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      openManager();
    });
  });
  root.querySelectorAll('[data-go-back]').forEach((el) => {
    el.addEventListener('click', goBack);
  });
  await wire();
  if (managerOpen) await wireManagerModal();
}

setRenderer(render);

const { data: { session: existingSession } } = await supabase.auth.getSession();
if (existingSession) {
  setSession(existingSession);
  go('record');
} else {
  render();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => console.error('SW registration failed', err));
  });
}
</script>
</body>
</html>
